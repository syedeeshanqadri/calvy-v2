<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse"><stop stop-color="#ecfdf5"/><stop offset="1" stop-color="#f0f9ff"/></linearGradient>
    <linearGradient id="grn" x1="740" y1="150" x2="1100" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#22c55e"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#166534" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(80,72)"><circle cx="9" cy="9" r="9" fill="#0284c7"/><text x="28" y="15" font-size="22" font-weight="700" fill="#0f172a">Calvy</text></g>
  <text x="80" y="150" font-size="15" font-weight="700" letter-spacing="3" fill="#16a34a">GET PAID UP FRONT</text>
  <text x="80" y="232" font-size="56" font-weight="800" fill="#0f172a" letter-spacing="-1">Accept Online</text>
  <text x="80" y="298" font-size="56" font-weight="800" fill="#16a34a" letter-spacing="-1">Payments for</text>
  <text x="80" y="364" font-size="56" font-weight="800" fill="#16a34a" letter-spacing="-1">Appointments</text>
  <text x="82" y="424" font-size="22" fill="#64748b">Deposits &amp; prepaid bookings, the easy way.</text>
  <g font-size="14" font-weight="600">
    <rect x="80" y="456" width="140" height="38" rx="19" fill="#dcfce7"/><text x="104" y="480" fill="#15803d">Prepaid</text>
    <rect x="232" y="456" width="150" height="38" rx="19" fill="#e0f2fe"/><text x="256" y="480" fill="#0369a1">Razorpay</text>
    <rect x="394" y="456" width="150" height="38" rx="19" fill="#f3e8ff"/><text x="418" y="480" fill="#7e22ce">Auto-payout</text>
  </g>
  <!-- payment / receipt card -->
  <g filter="url(#sh)" transform="translate(770,140)">
    <rect x="0" y="0" width="330" height="320" rx="28" fill="#ffffff" stroke="#dcfce7"/>
    <path d="M0 28 a28 28 0 0 1 28 -28 h274 a28 28 0 0 1 28 28 v52 h-330 z" fill="url(#grn)"/>
    <text x="26" y="36" font-size="14" fill="#dcfce7">Amount</text>
    <text x="26" y="64" font-size="26" font-weight="800" fill="#fff">₹650.00</text>
    <g transform="translate(250,24)"><rect width="56" height="32" rx="16" fill="#ffffff" opacity="0.25"/><text x="28" y="21" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Paid</text></g>
    <!-- card chip -->
    <rect x="26" y="104" width="278" height="80" rx="14" fill="#0f172a"/>
    <rect x="44" y="124" width="30" height="22" rx="4" fill="#fbbf24"/>
    <text x="44" y="172" font-size="13" font-weight="600" fill="#cbd5e1" letter-spacing="2">•••• •••• •••• 4242</text>
    <!-- success -->
    <g transform="translate(26,204)">
      <rect width="278" height="44" rx="12" fill="#ecfdf5"/>
      <circle cx="30" cy="22" r="13" fill="#22c55e"/>
      <path d="M24 22 l4 4 l9 -10" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="52" y="20" font-size="12.5" font-weight="700" fill="#0f172a">Payment received</text>
      <text x="52" y="36" font-size="11" fill="#16a34a">Booking confirmed automatically</text>
    </g>
    <text x="26" y="280" font-size="11" fill="#9b9b9b">Settled to your account · ref #PAY-8842</text>
  </g>
</svg>
