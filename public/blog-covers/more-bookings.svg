<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse"><stop stop-color="#f0f9ff"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient>
    <linearGradient id="sky" x1="740" y1="140" x2="1100" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#0284c7" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(80,72)"><circle cx="9" cy="9" r="9" fill="#0284c7"/><text x="28" y="15" font-size="22" font-weight="700" fill="#0f172a">Calvy</text></g>
  <text x="80" y="150" font-size="15" font-weight="700" letter-spacing="3" fill="#0284c7">GROW YOUR BUSINESS</text>
  <text x="80" y="232" font-size="56" font-weight="800" fill="#0f172a" letter-spacing="-1">How to Get</text>
  <text x="80" y="298" font-size="56" font-weight="800" fill="#0284c7" letter-spacing="-1">More Bookings</text>
  <text x="82" y="356" font-size="22" fill="#64748b">7 proven tactics to fill your calendar.</text>
  <g font-size="14" font-weight="600">
    <rect x="80" y="392" width="170" height="38" rx="19" fill="#e0f2fe"/><text x="104" y="416" fill="#0369a1">Booking page</text>
    <rect x="262" y="392" width="140" height="38" rx="19" fill="#dcfce7"/><text x="286" y="416" fill="#15803d">Reviews</text>
