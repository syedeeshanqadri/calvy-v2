  </g>
  <!-- analytics growth card -->
  <g filter="url(#sh)" transform="translate(770,130)">
    <rect x="0" y="0" width="330" height="350" rx="28" fill="#ffffff" stroke="#e2e8f0"/>
    <path d="M0 28 a28 28 0 0 1 28 -28 h274 a28 28 0 0 1 28 28 v48 h-330 z" fill="url(#sky)"/>
    <text x="26" y="45" font-size="15" font-weight="700" fill="#fff">Bookings this month</text>
    <text x="26" y="118" font-size="34" font-weight="800" fill="#0f172a">+38%</text>
    <text x="26" y="142" font-size="12" fill="#16a34a">▲ vs last month</text>
    <!-- bars -->
    <g>
      <rect x="26" y="250" width="34" height="40" rx="6" fill="url(#bar)"/>
      <rect x="74" y="232" width="34" height="58" rx="6" fill="url(#bar)"/>
      <rect x="122" y="244" width="34" height="46" rx="6" fill="url(#bar)"/>
      <rect x="170" y="210" width="34" height="80" rx="6" fill="url(#bar)"/>
      <rect x="218" y="190" width="34" height="100" rx="6" fill="url(#bar)"/>
      <rect x="266" y="166" width="34" height="124" rx="6" fill="url(#bar)"/>
    </g>
    <rect x="26" y="306" width="278" height="30" rx="9" fill="#f0f9ff"/>
    <text x="44" y="326" font-size="12" font-weight="600" fill="#0369a1">Show-up rate</text>
    <text x="286" y="326" font-size="12" font-weight="700" fill="#0284c7" text-anchor="end">95%</text>
