    <path d="M0 30 a30 30 0 0 1 30 -30 h260 a30 30 0 0 1 30 30 v44 h-320 z" fill="url(#pink)"/>
    <text x="28" y="40" font-size="15" font-weight="700" fill="#fff">Glow Beauty Studio</text>
    <text x="28" y="60" font-size="11" fill="#fbcfe8">Pick a service ✂</text>
    <g>
      <rect x="24" y="96" width="272" height="56" rx="14" fill="#fdf2f8" stroke="#fbcfe8"/>
      <text x="44" y="122" font-size="14" font-weight="700" fill="#0f172a">Haircut &amp; Style</text>
      <text x="44" y="140" font-size="11" fill="#9b9b9b">45 min</text>
      <text x="276" y="130" font-size="14" font-weight="700" fill="#db2777" text-anchor="end">₹650</text>
    </g>
    <g>
