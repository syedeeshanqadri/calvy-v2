    <linearGradient id="pink" x1="720" y1="120" x2="1120" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="#ec4899"/><stop offset="1" stop-color="#db2777"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#9d174d" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(80,72)"><circle cx="9" cy="9" r="9" fill="#0284c7"/><text x="28" y="15" font-size="22" font-weight="700" fill="#0f172a">Calvy</text></g>
  <text x="80" y="150" font-size="15" font-weight="700" letter-spacing="3" fill="#db2777">FOR SALONS &amp; BEAUTY</text>
  <text x="80" y="232" font-size="56" font-weight="800" fill="#0f172a" letter-spacing="-1">Online Booking</text>
  <text x="80" y="298" font-size="56" font-weight="800" fill="#db2777" letter-spacing="-1">System for Salons</text>
  <text x="82" y="356" font-size="22" fill="#64748b">Fill your chairs — let clients book 24/7.</text>
  <g font-size="14" font-weight="600">
